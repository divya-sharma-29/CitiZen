<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1180" viewBox="0 0 1600 1180" role="img" aria-labelledby="title description">
  <title id="title">CitiZen system architecture</title>
  <desc id="description">Architecture overview of the CitiZen React website, Express API, MongoDB data store, local uploads, email, and map integrations, plus a component relationship view.</desc>
  <defs>
    <linearGradient id="header" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#102a43"/>
      <stop offset="1" stop-color="#174c57"/>
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#627d98"/>
    </marker>
    <style>
      text { font-family: Inter, "Segoe UI", Arial, sans-serif; fill: #243b53; }
      .title { font-size: 34px; font-weight: 700; fill: #fff; }
      .subtitle { font-size: 15px; fill: #d9e8ef; }
      .section { font-size: 19px; font-weight: 700; fill: #102a43; }
      .group-title { font-size: 15px; font-weight: 700; letter-spacing: .5px; }
      .node-title { font-size: 15px; font-weight: 700; }
      .node-text { font-size: 12px; fill: #486581; }
      .small { font-size: 11px; fill: #627d98; }
      .edge-label { font-size: 11px; font-weight: 600; fill: #486581; }
      .panel { fill: #fff; stroke: #d9e2ec; stroke-width: 1.5; }
      .client-box { fill: #eff8f6; stroke: #8bc7ba; }
      .api-box { fill: #eff5fb; stroke: #8bb5d7; }
      .data-box { fill: #f4f1fb; stroke: #b6a4df; }
      .external-box { fill: #fff8eb; stroke: #e8c27d; }
      .node { stroke-width: 1.2; rx: 12; }
      .edge { fill: none; stroke: #627d98; stroke-width: 2; marker-end: url(#arrow); }
      .dashed { stroke-dasharray: 6 5; }
      .pill { fill: #e6f4f1; }
      .pill-blue { fill: #e8f1fa; }
      .pill-purple { fill: #eee9f8; }
      .pill-amber { fill: #fff1d6; }
    </style>
  </defs>

  <rect width="1600" height="1180" fill="#f3f7fa"/>
  <rect width="1600" height="126" fill="url(#header)"/>
  <circle cx="1512" cy="22" r="118" fill="#ffffff" opacity=".045"/>
  <circle cx="1435" cy="115" r="83" fill="#8bc7ba" opacity=".12"/>
  <text x="64" y="58" class="title">CitiZen | System Architecture</text>
  <text x="66" y="91" class="subtitle">Civic reporting, transparent resolution, and authority workflows</text>
  <text x="1530" y="70" text-anchor="end" class="subtitle">IMPLEMENTED SYSTEM VIEW</text>

  <text x="64" y="166" class="section">01  Application architecture</text>
  <text x="1536" y="166" text-anchor="end" class="small">Browser to API to persistence and external services</text>

  <rect x="54" y="190" width="458" height="524" rx="18" class="panel"/>
  <rect x="54" y="190" width="458" height="52" rx="18" fill="#e6f4f1"/>
  <path d="M54 224 H512 V242 H54 Z" fill="#e6f4f1"/>
  <circle cx="80" cy="216" r="7" fill="#2f8f83"/>
  <text x="98" y="221" class="group-title" fill="#17675e">WEB CLIENT  /  REACT + TYPESCRIPT</text>

  <rect x="84" y="269" width="398" height="64" rx="12" class="node client-box"/>
  <text x="105" y="295" class="node-title">Browser and React Router</text>
  <text x="105" y="316" class="node-text">Vite app entry, route selection, shared layout</text>

  <path d="M283 334 V359" class="edge"/>
  <text x="296" y="350" class="edge-label">renders</text>

  <rect x="84" y="367" width="188" height="74" rx="12" class="node client-box"/>
  <text x="101" y="393" class="node-title">Public and account</text>
  <text x="101" y="414" class="node-text">Landing, features, login, reset</text>
  <rect x="294" y="367" width="188" height="74" rx="12" class="node client-box"/>
  <text x="311" y="393" class="node-title">Citizen workspace</text>
  <text x="311" y="414" class="node-text">Dashboard, reports, profile</text>

  <rect x="84" y="459" width="188" height="74" rx="12" class="node client-box"/>
  <text x="101" y="485" class="node-title">Authority workspace</text>
  <text x="101" y="506" class="node-text">Assigned queue and status updates</text>
  <rect x="294" y="459" width="188" height="74" rx="12" class="node client-box"/>
  <text x="311" y="485" class="node-title">Admin workspace</text>
  <text x="311" y="506" class="node-text">Users, assignments, audit activity</text>

  <rect x="84" y="562" width="398" height="62" rx="12" class="node client-box"/>
  <text x="105" y="588" class="node-title">ProtectedRoute and fetch API calls</text>
  <text x="105" y="609" class="node-text">JWT session check, role gate, configured API URL</text>

  <rect x="84" y="646" width="398" height="43" rx="11" class="pill"/>
  <text x="105" y="673" class="node-text" fill="#17675e">Map UI: Leaflet, coordinate picker, report markers</text>

  <rect x="571" y="190" width="458" height="524" rx="18" class="panel"/>
  <rect x="571" y="190" width="458" height="52" rx="18" fill="#e8f1fa"/>
  <path d="M571 224 H1029 V242 H571 Z" fill="#e8f1fa"/>
  <circle cx="597" cy="216" r="7" fill="#3478a8"/>
  <text x="615" y="221" class="group-title" fill="#235d86">API SERVER  /  NODE.JS + EXPRESS</text>

  <rect x="601" y="269" width="398" height="64" rx="12" class="node api-box"/>
  <text x="622" y="295" class="node-title">REST API and static image serving</text>
  <text x="622" y="316" class="node-text">JSON and multipart requests, CORS, uploads</text>

  <rect x="601" y="365" width="190" height="74" rx="12" class="node api-box"/>
  <text x="618" y="391" class="node-title">JWT authentication</text>
  <text x="618" y="412" class="node-text">Load current active user</text>
  <rect x="809" y="365" width="190" height="74" rx="12" class="node api-box"/>
  <text x="826" y="391" class="node-title">Role guards</text>
  <text x="826" y="412" class="node-text">Citizen, authority, admin</text>

  <path d="M800 334 V348 H696 V363" class="edge"/>
  <text x="738" y="350" class="edge-label">protected calls</text>
  <path d="M792 402 H806" class="edge"/>
  <text x="793" y="390" class="edge-label">authorize</text>

  <rect x="601" y="466" width="190" height="80" rx="12" class="node api-box"/>
  <text x="618" y="492" class="node-title">Report workflows</text>
  <text x="618" y="513" class="node-text">Create, search, track, resolve</text>
  <rect x="809" y="466" width="190" height="80" rx="12" class="node api-box"/>
  <text x="826" y="492" class="node-title">Staff operations</text>
  <text x="826" y="513" class="node-text">Assignment, users, analytics</text>
  <path d="M696 440 V463" class="edge"/>
  <path d="M904 440 V463" class="edge"/>
  <text x="718" y="457" class="edge-label">authorized</text>
  <text x="924" y="457" class="edge-label">authorized</text>

  <rect x="601" y="572" width="398" height="56" rx="12" class="pill-blue"/>
  <text x="622" y="596" class="node-title" fill="#235d86">Civic logic</text>
  <text x="622" y="616" class="node-text">Priority scoring, nearby report similarity, activity</text>
  <path d="M696 548 V568" class="edge"/>
  <path d="M904 548 V558 H800 V570" class="edge"/>

  <rect x="601" y="646" width="398" height="43" rx="11" class="pill-blue"/>
  <text x="622" y="673" class="node-text" fill="#235d86">Multer uploads  |  Nodemailer recovery email</text>

  <rect x="1088" y="190" width="458" height="524" rx="18" class="panel"/>
  <rect x="1088" y="190" width="458" height="52" rx="18" fill="#eee9f8"/>
  <path d="M1088 224 H1546 V242 H1088 Z" fill="#eee9f8"/>
  <circle cx="1114" cy="216" r="7" fill="#7b61a8"/>
  <text x="1132" y="221" class="group-title" fill="#624c89">DATA AND EXTERNAL SERVICES</text>

  <rect x="1118" y="269" width="398" height="106" rx="12" class="node data-box"/>
  <text x="1140" y="296" class="node-title">MongoDB  /  Mongoose</text>
  <text x="1140" y="320" class="node-text">Users, reports, comments, notifications</text>
  <text x="1140" y="342" class="node-text">Ratings, activity history, audit logs</text>

  <rect x="1118" y="399" width="398" height="78" rx="12" class="node data-box"/>
  <text x="1140" y="426" class="node-title">Local uploads directory</text>
  <text x="1140" y="449" class="node-text">Report image files served by Express</text>

  <path d="M999 512 H1064 V322 H1116" class="edge"/>
  <text x="1010" y="502" class="edge-label">document CRUD</text>
  <path d="M999 665 H1068 V438 H1116" class="edge"/>

  <rect x="1118" y="506" width="188" height="68" rx="12" class="node external-box"/>
  <text x="1135" y="532" class="node-title">OpenStreetMap</text>
  <text x="1135" y="553" class="node-text">Map tiles</text>
  <rect x="1328" y="506" width="188" height="68" rx="12" class="node external-box"/>
  <text x="1345" y="532" class="node-title">Nominatim</text>
  <text x="1345" y="553" class="node-text">Reverse geocoding</text>

  <rect x="1118" y="596" width="398" height="64" rx="12" class="node external-box"/>
  <text x="1140" y="622" class="node-title">Configured SMTP provider</text>
  <text x="1140" y="643" class="node-text">Password recovery messages via Nodemailer</text>
  <path d="M482 666 H550 V302 H599" class="edge dashed"/>
  <text x="491" y="655" class="edge-label">HTTPS API</text>
  <path d="M482 667 H536 V730 H1074 V540 H1116" class="edge dashed"/>
  <text x="836" y="724" class="edge-label">map tiles from browser</text>
  <path d="M536 730 H1080 V490 H1422 V504" class="edge dashed"/>
  <text x="1270" y="484" class="edge-label">address lookup from browser</text>

  <rect x="54" y="744" width="1492" height="380" rx="18" class="panel"/>
  <text x="82" y="785" class="section">02  Component relationships</text>
  <text x="1517" y="784" text-anchor="end" class="small">How the website’s main components collaborate</text>

  <rect x="82" y="815" width="310" height="268" rx="15" fill="#eff8f6" stroke="#b3d9d1"/>
  <text x="105" y="846" class="group-title" fill="#17675e">PRESENTATION</text>
  <rect x="105" y="865" width="264" height="46" rx="10" class="node client-box"/>
  <text x="122" y="894" class="node-title">Public and account pages</text>
  <rect x="105" y="927" width="264" height="46" rx="10" class="node client-box"/>
  <text x="122" y="956" class="node-title">Citizen reporting and map</text>
  <rect x="105" y="989" width="264" height="46" rx="10" class="node client-box"/>
  <text x="122" y="1018" class="node-title">Authority and admin pages</text>

  <rect x="442" y="815" width="278" height="268" rx="15" fill="#f1f6fb" stroke="#c4d6e5"/>
  <text x="465" y="846" class="group-title" fill="#235d86">ROUTING AND ACCESS</text>
  <rect x="465" y="881" width="232" height="58" rx="10" class="node api-box"/>
  <text x="482" y="906" class="node-title">React Router</text>
  <text x="482" y="925" class="node-text">URL to page components</text>
  <rect x="465" y="959" width="232" height="58" rx="10" class="node api-box"/>
  <text x="482" y="984" class="node-title">ProtectedRoute</text>
  <text x="482" y="1003" class="node-text">Session and role validation</text>

  <rect x="770" y="815" width="330" height="268" rx="15" fill="#f1f6fb" stroke="#c4d6e5"/>
  <text x="793" y="846" class="group-title" fill="#235d86">API AND BUSINESS LOGIC</text>
  <rect x="793" y="865" width="284" height="46" rx="10" class="node api-box"/>
  <text x="810" y="894" class="node-title">Express REST endpoints</text>
  <rect x="793" y="927" width="284" height="46" rx="10" class="node api-box"/>
  <text x="810" y="956" class="node-title">JWT and role middleware</text>
  <rect x="793" y="989" width="284" height="46" rx="10" class="node api-box"/>
  <text x="810" y="1018" class="node-title">Report and staff workflows</text>

  <rect x="1150" y="815" width="366" height="268" rx="15" fill="#f6f3fb" stroke="#d4c8eb"/>
  <text x="1173" y="846" class="group-title" fill="#624c89">PERSISTENCE AND INTEGRATIONS</text>
  <rect x="1173" y="865" width="320" height="46" rx="10" class="node data-box"/>
  <text x="1190" y="894" class="node-title">Mongoose models to MongoDB</text>
  <rect x="1173" y="927" width="320" height="46" rx="10" class="node data-box"/>
  <text x="1190" y="956" class="node-title">Multer to local image files</text>
  <rect x="1173" y="989" width="320" height="46" rx="10" class="node external-box"/>
  <text x="1190" y="1018" class="node-title">SMTP and map service calls</text>

  <path d="M392 889 H439" class="edge"/>
  <text x="396" y="878" class="edge-label">routes</text>
  <path d="M392 950 H430 V910 H463" class="edge"/>
  <text x="398" y="938" class="edge-label">checks access</text>
  <path d="M720 910 H790" class="edge"/>
  <text x="726" y="898" class="edge-label">HTTP</text>
  <path d="M720 988 H752 V950 H790" class="edge"/>
  <text x="726" y="1010" class="edge-label">bearer token</text>
  <path d="M1078 888 H1170" class="edge"/>
  <text x="1083" y="876" class="edge-label">queries</text>
