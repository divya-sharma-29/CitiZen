  <text x="1083" y="939" class="edge-label">uploads</text>
  <path d="M1078 1012 H1170" class="edge"/>
  <text x="1083" y="1000" class="edge-label">notifications and email</text>

  <rect x="64" y="1143" width="12" height="12" rx="3" fill="#2f8f83"/>
  <text x="83" y="1154" class="small">Client</text>
  <rect x="160" y="1143" width="12" height="12" rx="3" fill="#3478a8"/>
  <text x="179" y="1154" class="small">Application and API</text>
  <rect x="320" y="1143" width="12" height="12" rx="3" fill="#7b61a8"/>
  <text x="339" y="1154" class="small">Persistence</text>
  <rect x="435" y="1143" width="12" height="12" rx="3" fill="#d39a34"/>
  <text x="454" y="1154" class="small">External services</text>
  <text x="1536" y="1154" text-anchor="end" class="small">CitiZen  |  system design overview</text>
</svg>
